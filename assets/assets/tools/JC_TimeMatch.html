<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRU / Gyro / GNSS – Time Match</title>
<script>try{var t=localStorage.getItem("tm_theme");document.documentElement.dataset.theme=(t==="light"||t==="dark")?t:"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
/* ---------- colour tokens: Day ---------- */
:root{color-scheme:light;
--bg:#f2f5f8;--card:#ffffff;--field:#ffffff;--fg:#131a23;--mut:#566273;--bd:#d3dae3;--line:#e2e7ee;
--ac:#0b5cad;--acfg:#ffffff;--ach:#094a8c;--acsoft:#e6eff9;
--ok:#16703f;--okbg:#e2f3e8;--okbd:#a9d9bb;--wn:#7a4f00;--wnbg:#fff5d9;--wnbd:#ecc35e;--er:#b42318;--erbg:#fdeceb;--erbd:#f2b3ac;
--swp:#3d7fd6;--swr:#d4851a;--swg:#8a68d6;
--p1:#e7effa;--pa:#d2e2f7;--pb:#dfe0f8;--pq:#b5d0f3;--r1:#fbf4e3;--ra:#f6e1c1;--rb:#f1eac0;--rq:#f2cb8d;--g1:#f1edfb;--gb:#dbe1f8;--gs:#e5d9f9;--gr:#d9efe8;
--tok:#2b8a3e;--twn:#f59f00;--ter:#e03131;--xmark:rgba(255,255,255,.95);--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);--chart:#fbfcfd}
/* ---------- Night (default) ---------- */
:root[data-theme=dark]{color-scheme:dark;
--bg:#0b1118;--card:#121a24;--field:#0e151e;--fg:#e2e8ef;--mut:#97a5b6;--bd:#2a3646;--line:#1f2a37;
--ac:#6bb0f5;--acfg:#06121f;--ach:#8fc4f8;--acsoft:#15263a;
--ok:#63d197;--okbg:#10291c;--okbd:#245c3c;--wn:#f3c76c;--wnbg:#2a2210;--wnbd:#6a5120;--er:#ff8d82;--erbg:#331512;--erbd:#743027;
--swp:#6aa5ef;--swr:#e8a24a;--swg:#ad94ee;
--p1:#13223a;--pa:#173250;--pb:#212a52;--pq:#1f4677;--r1:#271f11;--ra:#3b2b14;--rb:#332f15;--rq:#5f4214;--g1:#1c1931;--gb:#1d2950;--gs:#2d244d;--gr:#173a33;
--tok:#237a40;--twn:#e0a12e;--ter:#ff6b61;--xmark:#2a0f0d;--shadow:0 1px 2px rgba(0,0,0,.35);--chart:#0f1720}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
--bg:#0b1118;--card:#121a24;--field:#0e151e;--fg:#e2e8ef;--mut:#97a5b6;--bd:#2a3646;--line:#1f2a37;
--ac:#6bb0f5;--acfg:#06121f;--ach:#8fc4f8;--acsoft:#15263a;
--ok:#63d197;--okbg:#10291c;--okbd:#245c3c;--wn:#f3c76c;--wnbg:#2a2210;--wnbd:#6a5120;--er:#ff8d82;--erbg:#331512;--erbd:#743027;
--swp:#6aa5ef;--swr:#e8a24a;--swg:#ad94ee;
--p1:#13223a;--pa:#173250;--pb:#212a52;--pq:#1f4677;--r1:#271f11;--ra:#3b2b14;--rb:#332f15;--rq:#5f4214;--g1:#1c1931;--gb:#1d2950;--gs:#2d244d;--gr:#173a33;
--tok:#237a40;--twn:#e0a12e;--ter:#ff6b61;--xmark:#2a0f0d;--shadow:0 1px 2px rgba(0,0,0,.35);--chart:#0f1720}}

[hidden]{display:none!important}
html{background:var(--bg)}
body{font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;padding:18px 24px 40px;max-width:1400px;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--ac) 30%,transparent)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
*{scrollbar-color:var(--bd) transparent}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding:0 0 16px;margin:0 0 20px;border-bottom:1px solid var(--line)}
#ttl{font-size:21px;line-height:1.2;letter-spacing:-.015em;margin:0 auto 0 0;font-weight:650}
#ttl small{display:block;font-size:13px;font-weight:400;letter-spacing:0;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:2px;padding:3px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.tab{font:inherit;font-weight:550;background:transparent;color:var(--mut);border:0;border-radius:7px;padding:6px 15px;cursor:pointer}
button.tab:hover:not(:disabled){color:var(--fg);background:var(--acsoft);border-color:transparent}
.tab.on,button.tab.on:hover:not(:disabled){background:var(--ac);color:var(--acfg)}
.tsep{width:1px;align-self:stretch;margin:4px 4px;background:var(--bd)}
.tab.info{background:color-mix(in srgb,var(--mut) 16%,var(--card));color:var(--fg)}
button.tab.info:hover:not(:disabled){background:color-mix(in srgb,var(--mut) 28%,var(--card));color:var(--fg)}
.tab.info.on,button.tab.info.on:hover:not(:disabled){background:var(--mut);color:var(--card)}
.ht .ver{border-collapse:collapse;font-size:14px;white-space:normal;margin:4px 0 0}
.ht .ver th,.ht .ver td{text-align:left;padding:6px 14px;border:1px solid var(--line)}
.ht .ver th{position:static;background:var(--card)}
.theme{font:inherit;font-weight:550;display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:7px 13px;cursor:pointer}
button.theme:hover:not(:disabled){border-color:var(--ac);color:var(--ac);background:var(--card)}
.theme svg{width:16px;height:16px}

/* ---------- step cards (same language as How-To) ---------- */
.step{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 22px 20px;margin:0 0 14px;box-shadow:var(--shadow);transition:border-color .15s,background-color .15s}
.step.dz{border-color:var(--ac);background:color-mix(in srgb,var(--acsoft) 60%,var(--card))}
.sh{display:flex;align-items:center;gap:12px;margin:0}
.sh .no{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ac);color:var(--ac);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;font-variant-numeric:tabular-nums;transition:background-color .2s,color .2s}
.step.done .sh .no{background:var(--ac);color:var(--acfg)}
.sh h2{font-size:17px;line-height:1.3;letter-spacing:-.01em;margin:0;font-weight:650}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sw.p{background:var(--swp)}.sw.r{background:var(--swr)}.sw.g{background:var(--swg)}.sw.v{background:var(--ac)}
.opt{font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:0 8px}
.lead{color:var(--mut);margin:4px 0 14px 42px;font-size:13.5px;max-width:80ch}
.body{margin-left:42px}

/* drop zone */
.drop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px dashed var(--bd);border-radius:10px;padding:12px 14px;background:var(--field);color:var(--mut);transition:border-color .15s,background-color .15s}
.drop:hover{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd))}
.step.dz .drop{border-color:var(--ac);background:var(--acsoft)}
.drop svg{width:22px;height:22px;color:var(--ac);flex:none}
.drop b{color:var(--fg);font-weight:600}
input[type=file]{font:inherit;font-size:13px;color:var(--fg);max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:550;margin-right:10px;padding:5px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--ac);color:var(--ac)}

/* fields */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;margin-top:14px}
.mr{display:grid;grid-template-columns:repeat(var(--c,3),minmax(190px,1fr));gap:10px 14px;margin-top:12px}
.mr+.mr{padding-top:12px;border-top:1px dashed var(--line)}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:4px;font-weight:500}
label.in{flex-direction:row;align-items:center;gap:8px;margin-top:12px}
select,input[type=number],input[type=text]{font:inherit;font-size:13.5px;padding:5px 8px;min-height:32px;box-sizing:border-box;background:var(--field);color:var(--fg);border:1px solid var(--bd);border-radius:7px;max-width:100%;font-variant-numeric:tabular-nums}
select:hover,input[type=number]:hover,input[type=text]:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
input[type=number]{width:92px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac);margin:0}
::placeholder{color:var(--mut);opacity:.85;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-top:14px}

/* buttons */
button{font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acfg);cursor:pointer;transition:background-color .15s,border-color .15s}
button:hover:not(:disabled){background:var(--ach);border-color:var(--ach)}
button.sec{background:transparent;color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
button.sec:hover:not(:disabled){background:var(--acsoft);border-color:var(--ac)}
button.big{padding:10px 22px;font-size:15px}
button:disabled{opacity:.45;cursor:default}

.st{font-size:12.5px;color:var(--mut);margin-top:8px}
.act{align-items:center}

/* result banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--acsoft);color:var(--fg);font-size:13.5px;line-height:1.5;margin-top:14px}
.banner>svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner b{font-weight:650}
.banner.ok{background:var(--okbg);border-color:var(--okbd)}.banner.ok>svg{color:var(--ok)}
.banner.wn{background:var(--wnbg);border-color:var(--wnbd)}.banner.wn>svg{color:var(--wn)}
.banner.er{background:var(--erbg);border-color:var(--erbd)}.banner.er>svg{color:var(--er)}
.banner .gl{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;color:var(--mut)}
.banner .gl b{color:var(--fg)}
.stale{opacity:.45;filter:saturate(.4);transition:opacity .2s}

/* step 4 sub-blocks */
.sub{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.subh{font-size:15px;font-weight:650;margin:0 0 4px}

/* matched table */
.res{margin-top:14px}
.wrap{overflow:auto;max-height:60vh;border:1px solid var(--bd);border-radius:9px;background:var(--field)}
table{border-collapse:collapse;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:right}
th{position:sticky;top:0;font-weight:600;color:var(--fg);background:var(--card)}
td.l{text-align:left}td.c{text-align:center}
.pt{background:var(--p1)}.pa{background:var(--pa)}.pb{background:var(--pb)}.pq{background:var(--pq)}.rt{background:var(--r1)}.ra{background:var(--ra)}.rb{background:var(--rb)}.rq{background:var(--rq)}.gt{background:var(--g1)}.gb{background:var(--gb)}.gs{background:var(--gs)}.gr{background:var(--gr)}
tr.miss td{background-image:linear-gradient(color-mix(in srgb,var(--er) 24%,transparent),color-mix(in srgb,var(--er) 24%,transparent))}
tr.miss td:first-child{box-shadow:inset 4px 0 0 var(--er)}
span.ok,span.err{display:inline-block;min-width:54px;text-align:center;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;letter-spacing:.02em;border:1px solid}
span.ok{background:var(--okbg);color:var(--ok);border-color:var(--okbd)}span.err{background:var(--erbg);color:var(--er);border-color:var(--erbd)}

/* plots */
.pw{margin:16px 0 22px}.pw h3{font-size:14px;margin:0 0 6px;font-weight:650}
.pw canvas{display:block;width:100%;border:1px solid var(--bd);border-radius:8px;background:var(--chart)}
.pw table{margin-top:10px}
.lg{font-size:12.5px;color:var(--mut);margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:4px 16px}
.lg b{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.lg b.dt{height:9px;width:9px;border-radius:50%}
.lg b.ring{height:8px;width:8px;border-radius:50%;background:transparent;border:2px solid var(--er)}
.tg{margin:6px 0 8px}.tgl{font-size:12.5px;color:var(--mut);margin-bottom:4px}
.tgb{display:flex;gap:2px}.tgb i{flex:1;min-width:5px;max-width:28px;height:16px;border-radius:3px}
.tgk{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin:0 4px 0 10px}
.t-ok{background:var(--tok)}.t-wn{background:var(--twn)}.t-er{background:var(--ter)}
.pw .banner{margin:8px 0 10px}
#tip{position:fixed;z-index:9;background:#1b2430;color:#fff;font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;pointer-events:none;white-space:pre;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* previews */
details.pv{margin-top:12px}
details summary{cursor:pointer;font-size:12.5px;color:var(--ac);font-weight:550;width:max-content;max-width:100%}
.pvw{overflow:auto;max-height:260px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--field)}
.pvw tr.pre td{color:var(--mut);font-style:italic}.pvw tr.sr td{background:color-mix(in srgb,var(--swp) 20%,transparent)}.pvw td.tc{background:color-mix(in srgb,#f59f00 22%,transparent)}.pvw td.rn,.pvw th{color:var(--mut)}.pvw td{text-align:left}

/* convergence (key-in) */
label.cv{flex-direction:row;align-items:center;gap:10px;background:var(--wnbg);border:1.5px solid var(--wnbd);border-radius:9px;padding:6px 8px 6px 12px;font-weight:600;color:var(--fg);margin:0}
label.cv svg{width:16px;height:16px;color:var(--wn)}
label.cv input{width:150px}
label.cv.done{background:var(--okbg);border-color:var(--okbd)}label.cv.done svg{color:var(--ok)}
.reqmsg{display:flex;gap:8px;align-items:flex-start;background:var(--wnbg);border:1px solid var(--wnbd);color:var(--fg);padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13.5px}
details.adv{margin-top:16px}
/* no-match cells carry an X and gap cells are half height, so they read without colour */
.tgb{align-items:flex-end}
.tgb i.t-wn{height:9px}
.tgb i.t-er{position:relative}.tgb i.t-er::after{content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--xmark);font:700 14px/1 system-ui,sans-serif;font-style:normal}
.tgk.t-er,.demo dt i.t-er{background-image:linear-gradient(45deg,transparent 38%,var(--xmark) 38% 62%,transparent 62%),linear-gradient(-45deg,transparent 38%,var(--xmark) 38% 62%,transparent 62%)}
.tgk.t-wn{height:6px;vertical-align:1px}.demo dt{align-items:flex-end}.demo dt i.t-wn{height:7px}
/* folding steps */
.sh .sum{color:var(--mut);font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh .fold{margin-left:auto;padding:4px 14px;font-size:13px;flex:none}
.step.folded>.lead,.step.folded>.body{display:none}
/* sticky step-4 bar */
.s4bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;margin:12px -22px 0;padding:10px 22px 10px 64px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.s4bar .bt{font-size:13.5px;margin-right:auto}
.s4bar a{color:var(--ac);font-size:13px;font-weight:550;text-decoration:none}.s4bar a:hover{text-decoration:underline}
.s4bar button{padding:6px 14px;font-size:13.5px}
.bad{color:var(--er);font-weight:650}
.sub,.gen{scroll-margin-top:70px}
.nl{margin:6px 0 0;padding-left:18px}.nl li{margin:2px 0}
.reqmsg>svg{width:18px;height:18px;flex:none;color:var(--wn);margin-top:1px}
.gen{margin-top:24px;padding:16px 20px 18px;border-radius:10px;background:var(--acsoft);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--bd))}
.gen .subh{display:flex;align-items:center;gap:10px}
.gen .banner{margin-top:4px}
.tbh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;margin:16px 0 6px}
.tbls>.tbh:first-child{margin-top:6px}
.ctab{overflow:auto;margin-top:12px}
tr.srow th{text-align:right;font-weight:650;background:var(--card)}
tr.s0 th,tr.s0 td{border-top:2px solid var(--bd)}
/* ---------- How-To ---------- */
.ht{--ink2:color-mix(in srgb,var(--fg) 78%,var(--bg));--line:color-mix(in srgb,var(--bd) 70%,transparent);--tint:color-mix(in srgb,var(--ac) 8%,var(--bg));
 display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 40px;align-items:start;font-size:15px;line-height:1.6;color:var(--fg)}
.ht[hidden]{display:none!important}
.ht ::selection{background:color-mix(in srgb,var(--ac) 28%,transparent)}
.ht a{color:var(--ac);text-underline-offset:3px;text-decoration-thickness:1px}
.ht a:focus-visible,.ht button:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}
.ht-nav{position:sticky;top:14px;font-size:13px;border-right:1px solid var(--line);padding:4px 16px 4px 0}
.ht-nav p{margin:0 0 8px;font-weight:600;color:var(--fg)}
.ht-nav ol{list-style:none;margin:0;padding:0}
.ht-nav li{margin:0}
.ht-nav a{display:block;padding:4px 8px;margin-left:-8px;border-radius:5px;color:var(--mut);text-decoration:none}
.ht-nav a:hover{color:var(--fg);background:var(--card)}
.ht-main{max-width:64ch;min-width:0}
.ht-main>section{background:none;border:0;border-radius:0;padding:0;margin:0;border-top:1px solid var(--line);padding:28px 0 30px;scroll-margin-top:12px}
.ht-main>section:first-child{border-top:0;padding-top:4px}
.ht h2{font-size:19px;line-height:1.3;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance;display:flex;align-items:center;gap:10px}
.ht .lead{color:var(--ink2);margin:0 0 18px}
.ht p{margin:0 0 12px}
.ht b{font-weight:600}
.ht ul{margin:0;padding:0 0 0 18px}.ht ul li{margin:0 0 8px}.ht ul li::marker{color:var(--mut)}
.ht .sw{width:10px;height:10px;border-radius:3px;flex:none}
.ht .sw.m{background:var(--swp)}.ht .sw.g{background:var(--swg)}.ht .sw.v{background:var(--ac)}
.ht .jump{margin-left:auto;font:inherit;font-size:13px;font-weight:500;padding:4px 10px;border-radius:6px;background:transparent;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent)}
.ht .jump:hover{background:var(--tint)}

/* quick start: a track, the order matters */
.qs{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:q}
.qs li{position:relative;padding:0 14px 0 0;counter-increment:q}
.qs li::before{content:counter(q);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
 background:var(--bg);border:1.5px solid var(--ac);color:var(--ac);font-weight:700;font-size:14px;position:relative;z-index:1;margin-bottom:12px;font-variant-numeric:tabular-nums}
.qs li::after{content:"";position:absolute;top:15px;left:30px;right:0;height:1.5px;background:color-mix(in srgb,var(--ac) 35%,transparent)}
.qs li:last-child::after{display:none}
.qs li:last-child::before{background:var(--ac);color:var(--acfg)}
.qs b{display:block;font-size:15px;margin-bottom:2px}
.qs span{display:block;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.ht .note{margin:20px 0 0;padding:10px 14px;border-radius:8px;background:var(--tint);border:1px solid color-mix(in srgb,var(--ac) 22%,transparent);font-size:14px}

/* the general procedure */
.proc{list-style:none;margin:0;padding:0;counter-reset:s}
.proc>li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:18px}
.proc>li::before{content:counter(s);grid-row:1/span 9;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--bd);
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.proc>li::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:1px;background:var(--line)}
.proc>li:last-child{padding-bottom:0}.proc>li:last-child::after{display:none}
.proc h3{font-size:15px;margin:2px 0 2px;font-weight:600}
.proc p{margin:0;color:var(--ink2)}
.proc .opt{font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}

/* time-gap strip legend, drawn like the real strip */
.demo{margin:10px 0 2px;display:flex;flex-direction:column;gap:8px}
.demo .tgb{max-width:340px}
.demo dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:14px}
.demo dt{display:flex;align-items:center}.demo dd{margin:0;color:var(--ink2)}
.demo dt i{width:14px;height:14px;border-radius:3px;display:block}

/* formulas */
.fx{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:4px 0 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:14px}
.fx dt{font-weight:600}.fx dd{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
.ht kbd{font:inherit;font-size:13px;font-weight:600;padding:1px 6px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;background:var(--bg);white-space:nowrap}
.ht .tip{color:var(--ink2);font-size:14px}

/* troubleshooting */
.fix{margin:0}
.fix dt{font-weight:600;margin:0}
.fix dd{margin:2px 0 14px;color:var(--ink2)}
.fix dd:last-child{margin-bottom:0}

@media(max-width:820px){
 .ht{grid-template-columns:1fr}
 .ht-nav{position:static;border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:8px}
 .ht-nav ol{display:flex;flex-wrap:wrap;gap:2px 6px}.ht-nav a{margin-left:0}
 .qs{grid-template-columns:1fr;gap:14px}
 .qs li{display:grid;grid-template-columns:30px 1fr;gap:0 12px;padding:0}
 .qs li::before{grid-row:1/span 2;margin:0}
 .qs li::after{top:30px;bottom:-14px;left:14.5px;right:auto;width:1.5px;height:auto}
}

  const st=Array.from({length:n},(_,k)=>stat(R.map(q=>q.co[k]))),pa=$('#g_pa'),av=st.map(x=>x?x.avg:NaN).filter(isFinite),auto=!pa.dataset.t,cen=auto?(Math.max(...av)-Math.min(...av)>5):pa.checked,out=[],lg=document.createElement('div');lg.className='lg';
  for(let k=0;k<n;k++){const col=PCOL[k%PCOL.length],m=cen&&st[k]?st[k].avg:0,

  if(auto)pa.checked=cen;if(cen)lg.insertAdjacentHTML('beforeend',auto?'<span>Centred automatically because the gyro averages differ by more than 5° – untick the box above to see the real values.</span>':'');
  {const um=bk.rows.map((o,i)=>({o,i})).filter(q=>q.o[3]!=='OK'&&isFinite(q.o.ts));

/* DGNSS: observed (computed E/N from the file) vs raw equipment E/N; difference = raw - observed */
function renderGnss(s,box){
  const bk=s.out.blocks.find(x=>x.g.k==='A');if(!bk)return;const g=bk.g,ne=g.eqIdx(s.out.n).length,fit=$('#v_fit').checked;
  const ti=id=>3+g.fields.length+ne+g.tail.findIndex(t=>t[0]===id);
  [['E','Easting',0,'ce',8],['N','Northing',1,'cn',9]].forEach(([k,nm,ei,id,ri],gi)=>{
    const w=document.createElement('div');w.className='pw';w.innerHTML=`<h3>${nm} (m) – Observed vs Raw</h3>`;
    if(!gi){w.appendChild(stripEl(bk.rows,s.out.tol));const me=missEl(bk.rows,'Kept in Observed (red ring); Raw and Difference use the matched rows only.');if(me)w.appendChild(me)}
    const R=bk.rows.map((o,i)=>{const ob=f_(o[ti(id)]),rw=f_(o[ri]);return {i,o,t:o.ts,ob,rw,df:rw-ob}})
      .filter(q=>isFinite(q.t)&&isFinite(q.ob)).sort((a,b)=>a.t-b.t);
    box.appendChild(w);
    if(!R.length){w.insertAdjacentHTML('beforeend',`<div class="reqmsg">${ICON.warn}<div>No ${nm} to plot – choose the Computed ${nm} column in step 2 (and check the raw ${nm} column in step 1).</div></div>`);return}
    const D=[{n:`Observed ${nm}`,c:OBSCOL,k:'ob'},{n:`Raw ${nm}`,c:PCOL[0],k:'rw'},{n:`Difference (Raw − Observed)`,c:'#2f9e44',k:'df'}],out=[],lg=document.createElement('div');lg.className='lg';
    const fd=v=>isFinite(v)?v.toFixed(3)+' m':'– (no raw match)';
    D.slice(0,2).forEach(d=>{const P=R.filter(q=>isFinite(q[d.k]));out.push({kind:'line',color:d.c,pts:P.filter(q=>q.o[3]==='OK').map(q=>[q.t,q[d.k]])});
      out.push({kind:'dots',color:d.c,pts:P.map(q=>{const mi=q.o[3]!=='OK';return [q.t,q[d.k],`Row ${q.i+1}  ${q.o[0]}\n${d.n}: ${q[d.k].toFixed(3)} m\nDifference (Raw − Observed): ${fd(q.df)}`+(mi?'\n'+NOMATCH:''),mi&&d.k==='ob']})});
      lg.insertAdjacentHTML('beforeend',`<span><b style="background:${d.c}"></b>${d.n}</span>`)});
    if(R.some(q=>q.o[3]!=='OK'))lg.insertAdjacentHTML('beforeend',`<span><b class="ring"></b>No raw match (kept${fit?' – may be outside the fitted graph':''})</span>`);
    w.appendChild(lg);const cv=document.createElement('canvas');w.appendChild(cv);
    const lg2=document.createElement('div');lg2.className='lg';lg2.style.marginTop='8px';lg2.innerHTML=`<span><b style="background:${D[2].c}"></b>Difference (Raw − Observed) – ${nm} (m)</span>`;w.appendChild(lg2);
    const cv2=document.createElement('canvas');w.appendChild(cv2);
    const f3=v=>isFinite(v)?v.toFixed(3):'–';
    w.insertAdjacentHTML('beforeend',calcTable(R,D.map(d=>({n:d.n+' (m)',k:d.k,f:f3})),q=>q.o[ti('set')]));
    const xr=fit?fitR(R):[Math.min(...R.map(q=>q.t)),Math.max(...R.map(q=>q.t))];
    drawChart(cv,out,3,' m',0,xr);
    const RD=R.filter(q=>isFinite(q.df));drawChart(cv2,[{kind:'line',color:D[2].c,pts:RD.map(q=>[q.t,q.df])},{kind:'dots',color:D[2].c,pts:RD.map(q=>[q.t,q.df,`Row ${q.i+1}  ${q.o[0]}\nDifference (Raw − Observed): ${q.df.toFixed(3)} m`])}],3,' m',200,xr)})}
function renderPlots(c){
  const p=c.p,s=S[p],box=$(`#${p}_pl`),sec=$(`#${p}_plots`);
  if(!s.out||!s.out.ser){sec.hidden=true;return}
  sec.hidden=false;box.innerHTML='';
  if(p==='m')return renderMru(s,box);
  if(p==='g')return renderGyro(s,box);
  if(p==='v')return renderGnss(s,box);
  const al=$(`#${p}_pa`).checked,{ser,n,tol}=s.out,shown={};
  PSPEC[p].forEach(sp=>{
    const b=s.out.blocks.find(b=>b.g.k===sp.g);if(!b)return;
    const sg=sp.flip&&$(`#${p}_${sp.flip}`)&&$(`#${p}_${sp.flip}`).checked?-1:1,eqs=sp.eqs(n),names=sp.names(n),base=3+b.g.fields.length;
    const w=document.createElement('div');w.className='pw';w.innerHTML=`<h3>${sp.title}</h3>`;
    if(!shown[sp.g]){shown[sp.g]=1;w.appendChild(stripEl(b.rows,tol))}
    const lg=document.createElement('div');lg.className='lg';
    /* observed points, in time order; unwrap heading so the line does not jump at 0/360 */
    let ob=b.rows.map((o,i)=>({i,o,t:o.ts,y:sg*sp.obs(o)})).filter(q=>isFinite(q.t)&&isFinite(q.y)).sort((a,b)=>a.t-b.t);
    if(sp.circ)ob.forEach((q,i)=>{if(i)q.y=ob[i-1].y+wrap180(q.y-ob[i-1].y)});
    const out=[];
    if(ob.length){
      const tmin=ob[0].t,tmax=ob[ob.length-1].t,pad=Math.max(5,(tmax-tmin)*0.05);
      eqs.forEach((ei,k)=>{
        /* constant offset raw - observed over the matched rows */
        let off=0,cnt=0,sx=0,sy=0;
        if(al)ob.forEach(q=>{const rv=f_(q.o[base+b.g.eqIdx(n).indexOf(ei)]);if(isFinite(rv)){const d=sp.circ?wrap180(rv-q.y):rv-q.y;if(sp.circ){sx+=Math.cos(d/RAD);sy+=Math.sin(d/RAD)}else sx+=d;cnt++}});
        if(cnt)off=sp.circ?Math.atan2(sy,sx)*RAD:sx/cnt;
        let R=ser[ei],pts=[];const idx=[];
        for(let i=0;i<R.t.length;i++)if(R.t[i]>=tmin-pad&&R.t[i]<=tmax+pad)idx.push(i);
        const stride=Math.max(1,Math.ceil(idx.length/3000));
        let j=0;
        for(let m=0;m<idx.length;m+=stride){const i=idx[m];while(j<ob.length-1&&Math.abs(ob[j+1].t-R.t[i])<Math.abs(ob[j].t-R.t[i]))j++;
          let v=R.v[i]-off;if(sp.circ)v=ob[j].y+wrap180(v-ob[j].y);pts.push([R.t[i],v])}
        out.push({kind:'line',color:PCOL[k%PCOL.length],pts});
        lg.insertAdjacentHTML('beforeend',`<span><b style="background:${PCOL[k%PCOL.length]}"></b>${names[k]}${al&&cnt?` (shifted ${(-off).toFixed(sp.dec)}${sp.unit.trim()?sp.unit:''})`:''}</span>`)});
      out.push({kind:'dots',color:OBSCOL,pts:ob.map(q=>{const rv=f_(q.o[base+b.g.eqIdx(n).indexOf(eqs[0])]);
        return [q.t,q.y,`Row ${q.i+1}  ${q.o[0]}\nObserved: ${q.y.toFixed(sp.dec)}${sp.unit}\nRaw (matched): ${isFinite(rv)?rv.toFixed(sp.dec):'—'}${sp.unit}\nGap: ${q.o[2]===''?'—':q.o[2]+' s'}`]})});
      lg.insertAdjacentHTML('beforeend',`<span><b class="dt" style="background:${OBSCOL}"></b>Observed (${ob.length} rows)</span>`)}
    w.appendChild(lg);const cv=document.createElement('canvas');w.appendChild(cv);box.appendChild(w);
    drawChart(cv,out,sp.dec,sp.unit)})}
addEventListener('resize',()=>CFG.forEach(c=>{if(!$(`#${c.p}_panel`).hidden&&S[c.p].out)try{renderPlots(c)}catch(e){}}));

<p class="lead">Same for MRU, Gyro and GNSS Verification.</p>

<li><b>RAW file</b><span>From the equipment. Drag &amp; drop it into the Equipment RAW File box.</span></li>

<section id="ht-before"><h2>Before you start</h2>
<ul><li>This page runs in your browser. Pick a tab at the top for the job you are doing: <b>MRU</b>, <b>Gyro</b> or <b>GNSS Verification</b>.</li>
<li>Every file box also accepts <b>drag &amp; drop</b>: drop the file anywhere on the box.</li>
<li>Every tab follows the same 4 steps: <b>1. Equipment RAW File</b> → <b>2. Observed file(s)</b> → <b>3. Excel Template</b> (optional) → <b>4. Match &amp; Generate</b>, where you check the graphs and stats and download the filled Excel. A step number turns solid blue when that step is done.</li>
<li>The tool opens in <b>Night mode</b>. Use the <b>Switch to Day / Switch to Night</b> button at the top right; your choice is remembered.</li></ul></section>

<section id="ht-steps"><h2>Steps for every tab</h2>
<ol class="proc">
<li><h3>Equipment RAW File</h3><p>Load the equipment log. Check <b>Data starts at row #</b>, then choose the <b>Time column</b> and the equipment column(s) – MRU: Pitch and Roll; Gyro: the number of gyros, then one column each; GNSS: Easting and Northing. Set <b>Match method</b> (Nearest second or Interpolate) and <b>Max time gap (s)</b>. The RAW file and the observed file are expected to use the same clock.</p>
<p style="margin-top:8px">Open <b>Show preview of the file</b> to check you picked the right columns. Orange = the time column, blue = the first data row.</p></li>
<li><h3>Observed Data CSV file(s)</h3><p>Load the CSV from JC Survey Toolkit. Check <b>Data starts at row #</b> and that every column selector is correct. Default columns are pre-selected (Time = column 10, Set Name = column 1), but always check them against the preview.</p></li>
<li><h3>Excel Template <span class="opt">Optional</span></h3><p>Load your template (saved as .xlsx) and pick the sheet. The column letters it writes to are under <b>Advanced</b>.</p></li>
<li><h3>Press <kbd>Match &amp; Generate</kbd></h3><p>Steps 1–3 fold into one-line summaries – press <b>Edit</b> to open one again. A bar at the top of step 4 stays in view with the match counts and the <b>Download filled Excel</b> button. The summary under the button tells you how many rows matched in each group. If you change anything in step 1 or 2 afterwards, it tells you to press Match &amp; Generate again. Then:</p>
<div class="demo"><div class="tgb" aria-hidden="true"><i class="t-ok"></i><i class="t-ok"></i><i class="t-ok"></i><i class="t-wn"></i><i class="t-ok"></i><i class="t-ok"></i><i class="t-er"></i><i class="t-ok"></i><i class="t-ok"></i><i class="t-ok"></i><i class="t-wn"></i><i class="t-ok"></i></div>
<dl><dt><i class="t-ok"></i></dt><dd>Matched</dd><dt><i class="t-wn"></i></dt><dd>Gap over half of the max gap (half-height cell)</dd><dt><i class="t-er"></i></dt><dd>No match (with an ×) – the row has no raw value. It is <b>kept</b> in the table, graphs and stats, marked in red (a red ring on the graph), so you can review it.</dd></dl></div>
<p style="margin-top:10px">Read the <b>time-gap strip</b> above each graph (one cell per observed row), then the graphs and the <b>calculation table</b> under each one: every row, plus <b>n / AVG / MIN / MAX / STDEV</b>. Tick <b>Fit graphs to the matched rows</b> if one far-away row squeezes the graph. STDEV is the sample standard deviation (same as Excel's STDEV). Use <b>Download CSV</b> or <b>Copy table</b> if you need the matched table.</p>
<p style="margin-top:8px"><b>Review first.</b> When you are happy, press <b>Download filled Excel (.xlsx)</b> – it is your choice. Rows with no raw match are highlighted in red in the sheet. A new copy is downloaded and your original is not changed.</p></li>
</ol></section>

<section id="ht-mru"><h2><span class="sw m"></span>MRU tab<button class="jump" type="button" onclick="showTab('mru');scrollTo(0,0)">Open MRU →</button></h2>
<dl class="fx"><dt>Pitch</dt><dd>FWD − AFT</dd><dt>Roll</dt><dd>PORT − STBD</dd><dt>C-O</dt><dd>Observed − Raw</dd></dl>
<ul><li>Two observed files: <b>2a. PITCH (AFT / FWD)</b> and <b>2b. ROLL (PORT / STBD)</b>. You can load one or both; the one you skip is left blank. Each has Time and Set Name, then N / E / Z for each point. Names are generated from the Set number (AFT01, FWD01, PORT01, STBD01).</li>
<li>Equipment columns: choose the <b>Pitch</b> and <b>Roll</b> columns.</li>
<li>Same maths as the CALC tab. Each graph shows <b>Observed</b>, <b>Raw</b> and <b>C-O</b>, with a calculation table under it that lists every row, like the Gyro tab.</li>
<li><b>Location, project and date</b> (optional): if the observed file(s) have these columns, they are picked by name in step 2 and written to the <b>PROJECT INPUT_IS</b> sheet – Location <b>C5</b>, Date <b>C6</b>, Project No <b>C7</b> (day-first dates). Cells can be changed under the Excel section's Advanced settings.</li></ul></section>

<section id="ht-gyro"><h2><span class="sw g"></span>Gyro tab<button class="jump" type="button" onclick="showTab('gyro');scrollTo(0,0)">Open Gyro →</button></h2>
<dl class="fx"><dt>Brg (G)</dt><dd>bearing from stern to bow</dd><dt>Brg (T)</dt><dd>Brg (G) + convergence</dd><dt>C-O</dt><dd>Brg (T) − raw gyro</dd></dl>
<ul><li>Choose the <b>Number of gyros</b> (1 to 6) and a column for each.</li>
<li>Observed file: Bow Bearing Deg / Min / Sec and Bow Dist, then the same for Stern. If the bearing is one DD.MMSS column, put it in Deg and set Min and Sec to "none". Default columns: <b>Bow Bearing Deg = column 7</b>, <b>Stern Bearing Deg = column 15</b> – check Min, Sec and Dist against the preview.</li>
<li><b>Key in the Convergence (°)</b> in the yellow box next to Match &amp; Generate (step 4). It is needed for the C-O and is also written to cell Y13 when you fill the Excel template (the cell can be changed under the Excel section's Advanced settings). It is not needed for matching.</li>
<li>The table and graph show every gyro, with AVG / MIN / MAX / STDEV of each C-O.</li>
<li><b>Stations, location, project and date</b> (optional): if the observed file has these columns, they are picked by name in step 2 and written to the template – occupied station name <b>C9</b>, Easting <b>G9</b>, Northing <b>K9</b>; backsight station name <b>C10</b>, Easting <b>G10</b>, Northing <b>K10</b>; Location <b>C7</b>, Project No <b>L7</b>, Date <b>L6</b> (day-first dates, e.g. 11/11/2026). Cells can be changed under the Excel section's Advanced settings; anything not in the file keeps the template value.</li>
<li>If the gyros differ by more than 5° from each other, the graph centres each one on its own average so you can read it. Tick or untick the box above the graph to change that. The table and stats are never changed.</li></ul></section>

<section id="ht-gnss"><h2><span class="sw v"></span>GNSS Verification tab<button class="jump" type="button" onclick="showTab('gnss');scrollTo(0,0)">Open GNSS →</button></h2>
<dl class="fx"><dt>Difference</dt><dd>Raw − Observed</dd></dl>
<ul><li>Equipment columns: choose the <b>Easting</b> and <b>Northing</b> columns.</li>
<li>Observed file: Time and Set Name, bearing and distance (used for the Excel fill), and <b>Computed Easting</b> and <b>Computed Northing</b>. Default columns: <b>Distance (HD) = column 6</b>, Computed Easting = 11, Computed Northing = 12.</li>
<li><b>Occupied / Backsight Datum</b> (optional): if the observed file has occupied and backsight datum name / Easting / Northing columns, they are picked by name in step 2 and written to the template – occupied name to <b>A10</b>, Easting to <b>B9</b>, Northing to <b>B10</b>; backsight name to <b>E10</b>, Easting to <b>G9</b>, Northing to <b>G10</b>. Location goes to <b>B4</b>, Date to <b>B5</b> (day-first dates) and Project No to <b>J5</b>. Cells can be changed under the Excel section's Advanced settings. If a column is not in the file, the template value is kept.</li>
<li>Graphs: <b>Observed vs Raw</b> for Easting and for Northing, each with a <b>Difference</b> graph under it. A calculation table lists every row (Observed, Raw, Difference) with n / AVG / MIN / MAX / STDEV.</li></ul></section>

<section id="ht-fix"><h2>If something looks wrong</h2>
<dl class="fix">
<dt>All rows red, or "no match"</dt><dd>Check that both files use the same clock, the Time column, the Data starts at row # and the Max time gap.</dd>
<dt>Odd values in a table</dt><dd>Compare the column selectors with the preview of the observed file.</dd>
<dt>Gyro C-O is empty</dt><dd>Key in the convergence first.</dd>
<dt>Some rows have no match</dt><dd>They are never removed. They stay in the table, graphs and stats with a warning, and are highlighted in red in the filled Excel, so a person can review them before reporting.</dd>
<dt>"Inputs changed" message</dt><dd>You changed something in step 1 or 2 after matching. Press Match &amp; Generate again.</dd></dl></section>
</div></div>`;

/* ---------- matching ---------- */
function series(rows,ti,vi){
  const t=[],v=[];
  rows.forEach(r=>{const a=toSec(r[ti]),b=parseFloat(r[vi]);if(isFinite(a)&&isFinite(b)){t.push(a);v.push(b)}});
  const ix=t.map((_,i)=>i).sort((a,b)=>t[a]-t[b]);
  return {t:ix.map(i=>t[i]),v:ix.map(i=>v[i])}}

  const i=lo;
  if(mode==='i'&&i>0&&i<n&&s.t[i]-s.t[i-1]<=2*tol&&s.t[i]!==x){
    const f=(x-s.t[i-1])/(s.t[i]-s.t[i-1]),a=s.v[i-1],b=s.v[i];
    const v=circ?(a+f*(((b-a+540)%360)-180)+360)%360:a+f*(b-a);
    return {v,t:x,dt:0}}
  let best=null;
  [i-1,i].forEach(j=>{if(j>=0&&j<n){const dt=s.t[j]-x;if(!best||Math.abs(dt)<Math.abs(best.dt))best={v:s.v[j],t:s.t[j],dt}}});
  return best&&Math.abs(best.dt)<=tol+1e-9?best:null}
const autoName=(pre,v)=>{v=String(v).trim();if(v==='')return '';return pre+(/^\d+$/.test(v)?v.padStart(2,'0'):v)};
function groupRows(c,g,ser,n,mode,tol){
  const p=c.p,d=S[p].obs[g.k];if(!d)return [];
  const st=Math.max(1,+$(`#${p}_${g.k}_rs`).value||1);
  const F=g.fields.map(f=>f[5]?-1:+$(`#${p}_${g.k}_${f[0]}`).value),SI=+$(`#${p}_${g.k}_set`).value,ei=g.eqIdx(n);
  return d.rows.slice(st-1).filter(r=>r.some(x=>x!=='')).map(r=>{
    const cc=i=>i>=0?(r[i]??''):'',off=($(`#${p}_off`)?-(+$(`#${p}_off`).value||0):0)*3600;let ts=toSec(cc(F[0]));if(off&&isFinite(ts))ts=((ts+off)%86400+86400)%86400;
    const ms=ei.map(i=>look(ser[i],ts,mode,tol,g.circ)),ok=ms.every(Boolean),m0=ms[0];
    const o=[cc(F[0]),m0?fmtT(m0.t):'',m0?+m0.dt.toFixed(2):'',ok?'OK':'ERROR',
      ...g.fields.slice(1).map((f,j)=>f[5]?autoName(f[5],cc(SI)):cc(F[j+1])),...ms.map(m=>m?+m.v.toFixed(5):''),...(g.tail||[]).map(t=>cc(+$(`#${p}_${g.k}_${t[0]}`).value))];o.rt=m0?m0.t:null;o.ts=ts;
      if(g.post){g.post.b.forEach(([a,m,z])=>{const sp=splitBrg(o[a]),hasMS=o[m]!==''&&o[z]!=='';
          if(hasMS){o[a]=num(o[a]);o[m]=num(o[m]);o[z]=num(o[z])}

const GN={P:'Pitch',R:'Roll',G:'Gyro',A:'DGNSS'};
function banner(p,kind,html){const b=$(`#${p}_outSt`);if(!b)return;b.hidden=!html;b.className='banner '+kind;

function setFold(e,on){const b=e.querySelector('.fold');e.classList.toggle('folded',on);b.textContent=on?'Edit':'Fold';b.setAttribute('aria-expanded',!on)}
function foldSteps(c){const p=c.p,s=S[p],rs=id=>Math.max(1,+$(id).value||1)-1;

   ...c.groups.map(g=>{const d=s.obs[g.k];return [`${p}_s2${g.k}`,d?`${d.name} · ${d.rows.length-rs(`#${p}_${g.k}_rs`)} rows`:'not loaded']}),

function run(c){
  const p=c.p,s=S[p],msg=t=>banner(p,'er',t);

  const ci=rng(n).map(i=>+$(`#${p}_e${i}`).value);

  if(ti<0||need.some(v=>v<0)){msg('Select the Time column and the equipment column(s) in step 1 first.');return}

    cols=blocks.flatMap(b=>b.H.map((h,i)=>({h,cls:b.g.cls,kd:b.g.kind?b.g.kind(i):(i<3?'t':'d'),st:i===3})));

    const dec=cs.map((k,i)=>k.st?0:Math.min(6,Math.max(0,...b.rows.map(r=>{const v=String(r[i]??'');return isNum(v)&&v.includes('.')?v.split('.')[1].length:0})))),fmtV=(v,d)=>d&&isNum(v)?(+v).toFixed(d):v;
    return (multi?`<h4 class="tbh"><span class="sw ${b.g.cls}"></span>${GN[b.g.k]} – ${b.rows.length} rows</h4>`:'')+'<div class="wrap"><table><tr>'+cs.map(k=>`<th class="${k.cls}${k.kd}">${k.h}</th>`).join('')+'</tr>'+
    b.rows.map(r=>'<tr'+(r[3]!=='OK'?' class="miss"':'')+'>'+r.map((v,i)=>{const k=cs[i];
      if(k.st)return `<td class="c ${k.cls}${k.kd}">${v?`<span class="${v==='OK'?'ok':'err'}">${v}</span>`:''}</td>`;
      return `<td class="${k.cls}${k.kd} ${(i===0||/_Name$/.test(k.h)||k.h.includes('Time')&&!k.h.includes('Diff'))?'l':''}">${esc(fmtV(v,dec[i]))}</td>`}).join('')+'</tr>').join('')+'</table></div>'}).join('');
  $(`#${p}_res`).hidden=false;$(`#${p}_gen`).hidden=false;['res','plots'].forEach(x=>$(`#${p}_${x}`).classList.remove('stale'));$(`#${p}_cpSt`).textContent='';

      list.forEach(([r,v])=>setCell(d2,sd2,r,v));zip.file(t.path,ser(d2))}
    if(plan.hl.length)await redRows(zip,doc,sd,plan.hl);
    zip.file(sh.path,ser(doc));
    // make Excel recalculate everything on open; drop the stale calc chain
    const wbDoc=xml(await zip.file('xl/workbook.xml').async('string'));
    let cp=wbDoc.getElementsByTagName('calcPr')[0];
    if(!cp){cp=mkEl(wbDoc,'calcPr');const dn=wbDoc.getElementsByTagName('definedNames')[0]||wbDoc.getElementsByTagName('sheets')[0];dn.parentNode.insertBefore(cp,dn.nextSibling)}
    cp.setAttribute('fullCalcOnLoad','1');
    zip.file('xl/workbook.xml',ser(wbDoc));
    if(zip.file('xl/calcChain.xml')){
      zip.remove('xl/calcChain.xml');
      const ct=xml(await zip.file('[Content_Types].xml').async('string'));
      [...ct.getElementsByTagName('Override')].filter(o=>o.getAttribute('PartName')==='/xl/calcChain.xml').forEach(o=>o.parentNode.removeChild(o));
      zip.file('[Content_Types].xml',ser(ct));
      const rl=xml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
      [...rl.getElementsByTagName('Relationship')].filter(r=>/calcChain$/.test(r.getAttribute('Type'))).forEach(r=>r.parentNode.removeChild(r));
      zip.file('xl/_rels/workbook.xml.rels',ser(rl))}
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);const z2=v=>String(v).padStart(2,'0'),dt=new Date(),fn=s.xl.name.replace(/\.xlsx$/i,'')+`_filled_${dt.getFullYear()}${z2(dt.getMonth()+1)}${z2(dt.getDate())}-${z2(dt.getHours())}${z2(dt.getMinutes())}.xlsx`;a.download=fn;a.click();
    const mw=plan.miss.length;msg.className='banner '+(mw?'wn':'ok');msg.innerHTML=`${mw?ICON.warn:ICON.ok}<div><b>Downloaded ${esc(fn)}</b> – ${plan.n} ${plan.n===1?'row':'rows'} written into sheet "${esc(sh.name.trim())}".${plan.notes.length?'<ul class="nl">'+plan.notes.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}</div>`}
  catch(e){msg.className='banner er';msg.innerHTML=`${ICON.warn}<div><b>Fill failed:</b> ${esc(e.message)}</div>`}}

/* ---------- wire up ---------- */
$('#panels').innerHTML=CFG.map(panelHTML).join('')+HOWTO+ABOUT;
CFG.forEach(c=>{
  const p=c.p;
  $(`#${p}_rawF`).onchange=async e=>{const f=e.target.files[0];if(!f)return;S[p].raw=parseTable(await readF(f));S[p].rawName=f.name;rawUI(c,true)};
  $(`#${p}_rs`).onchange=()=>rawUI(c,false);
  $(`#${p}_rt`).onchange=()=>renderPv(p+'_rawPv',S[p].raw,Math.max(1,+$(`#${p}_rs`).value||1),+$(`#${p}_rt`).value);
  ['pa','sha','shf','shp','shs','fit'].forEach(k=>{const e=$(`#${p}_${k}`);if(e)e.onchange=e.oninput=()=>{e.dataset.t=1;renderPlots(c)}});
  if(p==='g'){const e=$('#g_conv');e.oninput=()=>{$('#g_cvl').classList.toggle('done',isFinite(parseFloat(e.value)));if(S[p].out)try{renderPlots(c)}catch(_){}}}
  if(c.dyn)$(`#${p}_n`).onchange=()=>buildEq(c,false);
  c.groups.forEach(g=>{
    $(`#${p}_f${g.k}`).onchange=async e=>{const f=e.target.files[0];if(!f)return;
      const rows=parseTable(await readF(f));S[p].obs[g.k]={rows,name:f.name};
      const r0=rows[0]||[];$(`#${p}_${g.k}_rs`).value=(r0.filter(isNum).length>=r0.length*0.3)?1:2;
      mapUI(c,g)};
    $(`#${p}_${g.k}_rs`).onchange=()=>mapUI(c,g)});
  $(`#${p}_go`).onclick=()=>run(c);
  [$(`#${p}_s1`),...c.groups.map(g=>$(`#${p}_s2${g.k}`))].forEach(e=>e.addEventListener('change',ev=>{if(!ev.target.closest('.pv'))markStale(c)}));
  $(`#${p}_tplS`).addEventListener('change',()=>updXl(c));$(`#${p}_x_cap`).addEventListener('change',()=>updXl(c));updXl(c);
  document.querySelectorAll(`#${p}_panel .fold`).forEach(b=>b.onclick=()=>{const e=b.closest('.step');setFold(e,!e.classList.contains('folded'))});
  $(`#${p}_xl2`).onclick=()=>{$(`#${p}_gen`).scrollIntoView({behavior:'smooth',block:'center'});$(`#${p}_xl`).click()};
  $(`#${p}_tplF`).onchange=e=>{const f=e.target.files[0];if(f)xlLoad(c,f)};
  $(`#${p}_xl`).onclick=()=>xlFill(c);
  $(`#${p}_dl`).onclick=()=>{
    const t=[S[p].out.H,...S[p].out.rows].map(r=>r.map(csvQ).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));
    a.download=(p==='m'?'MRU':p==='v'?'GNSS':'Gyro')+'_matched.csv';a.click()};
  $(`#${p}_cp`).onclick=()=>{
    const t=[S[p].out.H,...S[p].out.rows].map(r=>r.join('\t')).join('\n');
    navigator.clipboard.writeText(t).then(()=>$(`#${p}_cpSt`).textContent='Copied – paste into Excel.',
      ()=>$(`#${p}_cpSt`).textContent='Copy blocked by browser – use Download CSV.')}});
CFG.forEach(c=>{const p=c.p;
  const els=[...document.querySelectorAll(`#${p}_panel [id^="${p}_x_"],#${p}_panel [id^="${p}_xf"]`)].filter(e=>e.tagName!=='BUTTON');
  try{const sv=JSON.parse(localStorage.getItem('xlmap_'+p)||'{}');if(p==='g'&&sv.g_x_first==='23')delete sv.g_x_first;els.forEach(e=>{if(sv[e.id]==null)return;if(e.type==='checkbox')e.checked=sv[e.id]==='1';else e.value=sv[e.id]})}catch(_){}
  const save=()=>{try{const o={};els.forEach(e=>o[e.id]=e.type==='checkbox'?(e.checked?'1':'0'):e.value);localStorage.setItem('xlmap_'+p,JSON.stringify(o))}catch(_){}};
  els.forEach(e=>e.onchange=save);
  $(`#${p}_x_reset`).onclick=()=>{els.forEach(e=>{if(e.type==='checkbox')e.checked=e.dataset.def==='1';else e.value=e.dataset.def});save()}});
function xGyroBoxes(){const n=+$('#g_n').value;
  for(let i=0;i<6;i++){const e=$(`#g_xf0_${9+i}`);if(e)e.parentElement.hidden=i>=n}}
$('#g_n').addEventListener('change',xGyroBoxes);xGyroBoxes();
function showTab(t){const ht=t==='howto'||t==='about',c=ht?null:CFG[{mru:0,gyro:1,gnss:2}[t]];
  CFG.forEach(x=>$(`#${x.p}_panel`).hidden=x!==c);$('#howto_panel').hidden=t!=='howto';$('#about_panel').hidden=t!=='about';
  document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.t===t);b.setAttribute('aria-selected',b.dataset.t===t);b.tabIndex=b.dataset.t===t?0:-1});
  const TT={mru:['MRU','Match Observed data to Equipment RAW data by time'],gyro:['Gyro','Match Observed data to Equipment RAW data by time'],gnss:['GNSS Verification','Match Observed (total station) data to GNSS antenna positions by time'],howto:['How-To','Step by step guide'],about:['About','About, contact and version']}[t];
  $('#ttl').innerHTML=`${TT[0]}<small>${TT[1]}</small>`;if(c&&S[c.p].out)try{renderPlots(c)}catch(e){}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('.tabs').addEventListener('keydown',e=>{const T=[...document.querySelectorAll('.tab')],i=T.indexOf(document.activeElement);if(i<0)return;
  const j={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:T.length-1}[e.key];if(j==null)return;e.preventDefault();const b=T[(j+T.length)%T.length];b.focus();showTab(b.dataset.t)});
showTab('mru');

/* Day / Night */
const darkNow=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){const d=darkNow(),b=$('#theme');b.innerHTML=(d?ICON.sun:ICON.moon)+(d?'Switch to Day':'Switch to Night');b.title='Switch to '+(d?'day':'night')+' colours';
  CFG.forEach(c=>{if(!$(`#${c.p}_panel`).hidden&&S[c.p].out)try{renderPlots(c)}catch(e){}})}
{let t0=null;try{t0=localStorage.getItem('tm_theme')}catch(_){}document.documentElement.dataset.theme=(t0==='light'||t0==='dark')?t0:'dark'}
$('#theme').onclick=()=>{const t=darkNow()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('tm_theme',t)}catch(_){}paintTheme()};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(_){}
paintTheme();

/* drag & drop: drop a file anywhere on a section to load it into that section's file input */
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
document.querySelectorAll('input[type=file]').forEach(inp=>{
  const sec=inp.closest('section');if(!sec)return;
  let d=0;
  const on=()=>sec.classList.add('dz'),off=()=>{d=0;sec.classList.remove('dz')};
  sec.addEventListener('dragenter',e=>{e.preventDefault();d++;on()});
  sec.addEventListener('dragleave',()=>{if(--d<=0)off()});
  sec.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
  sec.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();off();
    const f=e.dataTransfer.files[0];if(!f)return;
    if(inp.accept&&!f.name.toLowerCase().endsWith(inp.accept.replace('*',''))){const st=sec.querySelector('.st');if(st)st.textContent='This box needs a '+inp.accept+' file – '+f.name+' was not loaded.';return}
    const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;
    inp.dispatchEvent(new Event('change',{bubbles:true}))});
});
